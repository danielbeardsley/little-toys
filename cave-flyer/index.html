<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cave Flyer</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    body {
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #dfe6ff;
    }
    canvas {
      display: block;
      width: min(100vw, calc(100dvh * 16 / 9));
      aspect-ratio: 16 / 9;
      background: #05060f;
    }
    .back {
      position: fixed;
      left: 8px;
      bottom: 6px;
      font-size: 12px;
      color: #8f9acb;
      opacity: 0.5;
      text-decoration: none;
    }
    .back:hover { opacity: 1; }
    #file-warning {
      position: fixed;
      inset: auto 1rem 2rem;
      max-width: 34rem;
      margin: auto;
      padding: 1rem 1.25rem;
      background: #2a1830;
      border: 1px solid #ff8a9c;
      border-radius: 10px;
      line-height: 1.4;
    }
    code { background: #0008; padding: 0 0.3em; border-radius: 4px; }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>
  <a class="back" href="../index.html">← Little Toys</a>

  <div id="file-warning" hidden>
    Browsers won't load JavaScript modules from a <code>file://</code> page.
    Serve this folder instead, e.g. run <code>python3 -m http.server</code> in
    the repo and open <code>http://localhost:8000/cave-flyer/</code>.
  </div>
  <script>
    if (location.protocol === 'file:') document.getElementById('file-warning').hidden = false;
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
